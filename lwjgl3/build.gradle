plugins { id 'application'; id 'eclipse' }
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
application { mainClass = 'puppy.code.lwjgl3.Lwjgl3Launcher' }
sourceSets.main.resources.srcDirs += [rootProject.file('assets')]
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}
run {
    workingDir = rootProject.file('assets')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}
// Incluye librerias y assets para entregar un solo archivo ejecutable.
tasks.register('dist', Jar) {
    dependsOn classes, configurations.runtimeClasspath
    archiveFileName = 'GameLluvia.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST', 'module-info.class'
}
