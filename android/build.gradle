plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'puppy.code.android'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.gamelluvia.juego'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    sourceSets.main {
        assets.srcDirs = [rootProject.file('assets')]
        jniLibs.srcDirs = [layout.buildDirectory.dir('natives').get().asFile]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
configurations { natives }
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}
tasks.register('extraerNativos') {
    inputs.files(configurations.natives)
    outputs.dir(layout.buildDirectory.dir('natives'))
    doLast {
        configurations.natives.files.each { archivo ->
            def abi = archivo.name.contains('arm64-v8a') ? 'arm64-v8a' :
                    archivo.name.contains('armeabi-v7a') ? 'armeabi-v7a' : 'x86_64'
            copy {
                from zipTree(archivo)
                include '*.so'
                into layout.buildDirectory.dir("natives/$abi")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'extraerNativos' }
